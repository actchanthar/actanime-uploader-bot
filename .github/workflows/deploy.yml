name: Deploy Bot to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile bot.py && echo "✅ Syntax OK"

      - name: Deploy files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST:     ${{ secrets.VPS_HOST }}
          REMOTE_USER:     ${{ secrets.VPS_USER }}
          SOURCE:          "./"
          TARGET:          "/root/tgvdup"
          EXCLUDE:         "tmp/, *.session, __pycache__/, *.log, .git/"
          ARGS:            "-rlgoDzvc --delete"

      - name: Install deps + restart bot + notify owner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/tgvdup

            # Create tmp folder
            mkdir -p tmp

            # Install Python packages
            pip3 install -q -r requirements.txt --break-system-packages

            # Stop ONLY this bot using PID file or specific path
            if [ -f /root/tgvdup/bot.pid ]; then
              PID=$(cat /root/tgvdup/bot.pid)
              kill "$PID" 2>/dev/null || true
            fi
            # Cleanup any old processes
            pkill -f "python3 /root/tgvdup/bot.py" || true
            pkill -f "python3 /root/actanime-bot/bot.py" || true
            pkill -f "python3 .*tgvdup/bot.py" || true
            sleep 2

            # Start bot with PID file
            nohup python3 /root/tgvdup/bot.py >> /root/tgvdup/bot.log 2>&1 &
            echo $! > /root/tgvdup/bot.pid
            sleep 3

            if kill -0 $(cat /root/tgvdup/bot.pid) 2>/dev/null; then
              echo "✅ Bot running! PID: $(cat /root/tgvdup/bot.pid)"

              # Notify Owner via Telegram
              if [ -f /root/tgvdup/config.env ]; then
                set -a
                source /root/tgvdup/config.env
                set +a
                if [ -n "$BOT_TOKEN" ] && [ -n "$OWNER_ID" ]; then
                  MSG="✅ *Auto Deploy Success*\n\nBot restarted on VPS.\nPID: $(cat /root/tgvdup/bot.pid)\nTime: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                    -d chat_id="${OWNER_ID}" \
                    -d text="${MSG}" \
                    -d parse_mode="Markdown" > /dev/null || echo "Notify failed (non-critical)"
                  echo "✅ Owner notified"
                fi
              fi
            else
              echo "❌ Bot crashed:"
              tail -20 /root/tgvdup/bot.log
              exit 1
            fi
