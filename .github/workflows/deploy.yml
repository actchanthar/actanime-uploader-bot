name: Deploy Bot to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile bot.py && echo "✅ Syntax OK"

      - name: Deploy files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST:     ${{ secrets.VPS_HOST }}
          REMOTE_USER:     ${{ secrets.VPS_USER }}
          SOURCE:          "./"
          TARGET:          "/root/tgvdup"
          EXCLUDE:         "tmp/, *.session, __pycache__/, *.log, .git/"
          ARGS:            "-rlgoDzvc --delete"

      - name: Stop old bot + install deps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /root/tgvdup || mkdir -p /root/tgvdup && cd /root/tgvdup
            mkdir -p tmp
            pip3 install -q -r requirements.txt --break-system-packages || true

            # Stop old process
            if [ -f bot.pid ]; then
              OLD_PID=$(cat bot.pid)
              kill $OLD_PID 2>/dev/null || true
              sleep 1
              kill -9 $OLD_PID 2>/dev/null || true
              rm -f bot.pid
            fi
            pkill -f "tgvdup/bot.py" 2>/dev/null || true
            pkill -f "actanime-bot/bot.py" 2>/dev/null || true
            sleep 1
            echo "Old processes stopped"

      - name: Start bot + notify owner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /root/tgvdup

            # Start fully detached
            setsid nohup python3 bot.py >> bot.log 2>&1 < /dev/null &
            NEW_PID=$!
            echo $NEW_PID > bot.pid
            sleep 5

            if kill -0 $NEW_PID 2>/dev/null; then
              echo "✅ Bot running! PID: $NEW_PID"

              # Notify Owner
              if [ -f config.env ]; then
                export $(grep -v '^#' config.env | xargs) 2>/dev/null || true
                if [ -n "$BOT_TOKEN" ] && [ -n "$OWNER_ID" ]; then
                  curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${OWNER_ID}" \
                    --data-urlencode "text=✅ Auto Deploy Success%0A%0ABot restarted on VPS.%0APID: ${NEW_PID}%0ATime: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
                    -d "parse_mode=Markdown" > /dev/null || echo "Notify failed"
                  echo "✅ Owner notified"
                fi
              fi
            else
              echo "❌ Bot failed to start. Last log:"
              tail -40 bot.log || true
              exit 1
            fi
