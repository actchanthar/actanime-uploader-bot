name: Deploy Bot to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile bot.py && echo "✅ Syntax OK"

      - name: Deploy files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST:     ${{ secrets.VPS_HOST }}
          REMOTE_USER:     ${{ secrets.VPS_USER }}
          SOURCE:          "./"
          TARGET:          "/root/tgvdup"
          EXCLUDE:         "tmp/, *.session, __pycache__/, *.log, .git/"
          ARGS:            "-rlgoDzvc --delete"

      - name: Install deps + restart bot + notify owner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /root/tgvdup

            # Create tmp folder
            mkdir -p tmp

            # Install Python packages
            pip3 install -q -r requirements.txt --break-system-packages || true

            # Stop ONLY this bot
            if [ -f /root/tgvdup/bot.pid ]; then
              OLD_PID=$(cat /root/tgvdup/bot.pid)
              kill "$OLD_PID" 2>/dev/null || true
              sleep 1
              kill -9 "$OLD_PID" 2>/dev/null || true
            fi
            pkill -f "/root/tgvdup/bot.py" 2>/dev/null || true
            pkill -f "/root/actanime-bot/bot.py" 2>/dev/null || true
            sleep 2

            # Start bot fully detached
            nohup python3 /root/tgvdup/bot.py >> /root/tgvdup/bot.log 2>&1 </dev/null &
            NEW_PID=$!
            echo $NEW_PID > /root/tgvdup/bot.pid
            disown $NEW_PID 2>/dev/null || true
            sleep 4

            if kill -0 $NEW_PID 2>/dev/null; then
              echo "✅ Bot running! PID: $NEW_PID"

              # Notify Owner via Telegram
              if [ -f /root/tgvdup/config.env ]; then
                set -a
                . /root/tgvdup/config.env
                set +a
                if [ -n "$BOT_TOKEN" ] && [ -n "$OWNER_ID" ]; then
                  MSG="✅ *Auto Deploy Success*%0A%0ABot restarted on VPS.%0APID: $NEW_PID%0ATime: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                    -d chat_id="${OWNER_ID}" \
                    -d text="${MSG}" \
                    -d parse_mode="Markdown" > /dev/null || echo "Notify failed (non-critical)"
                  echo "✅ Owner notified"
                fi
              fi
            else
              echo "❌ Bot crashed:"
              tail -30 /root/tgvdup/bot.log || true
              exit 1
            fi

            # Force clean exit so SSH session does not hang
            exit 0
